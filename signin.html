
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign In - Wild Rydes</title>

    <link rel="stylesheet" href="css/font.css">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="/css/message.css">

    <style>
        .auth-navigation {
            text-align: center;
            margin: 20px 0;
        }

        .auth-navigation a {
            display: inline-block;
            margin: 6px;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            background: #ffffff;
            color: #243b53;
            border: 1px solid #243b53;
        }

        .register-link {
            background: #243b53;
            color: #ffffff;
        }

        #signinMessage {
            text-align: center;
            margin: 12px;
            color: #b42318;
        }
    </style>
</head>

<body>
    <div id="noCognitoMessage"
         class="configMessage"
         style="display: none;">
        <div class="backdrop"></div>
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">Cognito Not Configured</h3>
            </div>
            <div class="panel-body">
                Check your Cognito settings in
                <a href="/js/config.js">js/config.js</a>.
            </div>
        </div>
    </div>

    <header>
        <a href="/index.html" aria-label="Wild Rydes home">
            <img src="images/logo.png" alt="Wild Rydes logo">
        </a>
    </header>

    <section class="form-wrap">
        <h1>Sign In</h1>

        <form id="signinForm">
            <input
                type="email"
                id="emailInputSignin"
                placeholder="Email"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="passwordInputSignin"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <input type="submit" id="signinButton" value="Sign In">
        </form>

        <p id="signinMessage" role="alert" aria-live="polite"></p>

        <div class="auth-navigation">
            <a class="home-link" href="/index.html">Home</a>
            <a class="register-link" href="/register.html">
                Create an Account
            </a>
        </div>
    </section>

    <script src="js/vendor/jquery-3.1.0.js"></script>
    <script src="js/vendor/bootstrap.min.js"></script>
    <script src="js/vendor/aws-cognito-sdk.min.js"></script>
    <script src="js/vendor/amazon-cognito-identity.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/cognito-auth.js"></script>
</body>
</html>
